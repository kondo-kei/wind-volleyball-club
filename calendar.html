<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wind VBC · Calendar</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<style>
:root {
  --bg:     #0b1f3a;
  --surf:   #0d2448;
  --ink:    #f0f5ff;
  --muted:  rgba(200,220,255,.65);
  --rule:   rgba(90,172,245,.12);
  --accent: #c9a84c;
  --prac:   rgba(59,130,246,.2);
  --prac-text: #93c5fd;
  --prac-border: rgba(59,130,246,.7);
  --tour:   rgba(239,68,68,.18);
  --tour-text: #fca5a5;
  --tour-border: #ef4444;
  --major:  rgba(245,158,11,.2);
  --major-text: #fcd34d;
  --major-border: #f59e0b;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'DM Sans', system-ui, sans-serif;
  font-weight: 300;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}

/* NAV */
nav {
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--rule);
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100;
  background: var(--bg);
  margin-left: max(-16px, calc(-1 * env(safe-area-inset-left, 0px)));
  margin-right: max(-16px, calc(-1 * env(safe-area-inset-right, 0px)));
  padding: 1.4rem max(2rem, env(safe-area-inset-left, 0px));
  padding-left: max(2rem, env(safe-area-inset-left, 0px));
  padding-right: max(2rem, env(safe-area-inset-right, 0px));
}
.nav-logo {
  font-family: 'Oswald', sans-serif;
  font-size: 1.5rem; font-weight: 500; letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink); text-decoration: none;
}
.nav-logo span { color: var(--accent); }
.nav-links { display: flex; gap: 2.5rem; list-style: none; align-items: center; }
.nav-links a {
  font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
  text-decoration: none; color: var(--muted); transition: color .2s;
}
.nav-links a:hover { color: var(--ink); }
.nav-links a.active { color: var(--ink); font-weight: 500; }
.nav-toggle {
  display: none; flex-direction: column; gap: 5px;
  width: 1.8rem; height: 1.8rem; background: none; border: none; cursor: pointer;
}
.nav-toggle span {
  display: block; height: 1.5px; background: var(--ink); border-radius: 1px;
  transition: transform .25s, opacity .25s;
}
.nav-toggle.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.nav-toggle.open span:nth-child(2) { opacity: 0; }
.nav-toggle.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
@media (max-width: 560px) {
  .nav-toggle { display: flex; }
  .nav-links {
    display: none; flex-direction: column; gap: 0;
    position: absolute; top: 100%; left: 0; right: 0;
    background: var(--bg); border-bottom: 1px solid var(--rule);
    padding: .5rem 0;
  }
  .nav-links.open { display: flex; }
  .nav-links li { width: 100%; }
  .nav-links a { display: block; padding: .8rem 2rem; }
}
/* LAYOUT */
.wrap { max-width: 1200px; margin: 0 auto; }
.main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3rem;
  align-items: start;
}
@media (max-width: 760px) {
  .main-grid { grid-template-columns: 1fr; gap: 0; }
}

/* HERO */
.hero {
  padding: 2rem 0 1.5rem;
  border-bottom: 1px solid var(--rule);
}
.eyebrow {
  font-size: .68rem; letter-spacing: .28em; text-transform: uppercase;
  color: var(--ink); opacity: .55; margin-bottom: .6rem;
}
.hero-title {
  font-family: 'Oswald', sans-serif;
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 400; line-height: 1.05;
  color: var(--ink);
  text-wrap: balance;
}

/* CONTENT */
.content { padding-block: 1rem 3rem; }

/* SECTION LABEL */
.section-label {
  font-size: .65rem; letter-spacing: .26em; text-transform: uppercase;
  color: var(--accent); margin-bottom: .7rem; font-weight: 500;
}

/* LEGEND */
.legend {
  display: flex; flex-wrap: wrap; gap: .3rem 1.4rem;
  margin-bottom: .8rem;
  font-size: .7rem; color: var(--muted); align-items: center;
}
.legend-item { display: flex; align-items: center; gap: .35rem; }
.legend-swatch { width: .75rem; height: .75rem; border-radius: 2px; flex-shrink: 0; }
.ls-prac  { background: var(--prac);  border: 1px solid var(--prac-border); }
.ls-tour  { background: var(--tour);  border: 1px solid var(--tour-border); }
.ls-major { background: var(--major); border: 1px solid var(--major-border); }
.ls-sb    { background: rgba(100,116,139,.18); border: 1px solid rgba(100,116,139,.3); }

/* CALENDAR CARD */
.cal-card {
  background: transparent;
  margin-bottom: 2rem;
}
.cal-inner { padding: 0; overflow-x: auto; }

.cal-hd-row {
  display: grid;
  grid-template-columns: 1.8rem repeat(7, minmax(0,1fr));
  gap: 2px;
  margin-bottom: 3px;
  border-bottom: 1px solid var(--rule);
  padding-bottom: 4px;
}
.cal-col-hd {
  font-size: .55rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink); font-weight: 500; text-align: center; padding: .1rem 0; opacity: .75;
}
.cal-grid {
  display: grid;
  grid-template-columns: 1.8rem repeat(7, minmax(0,1fr));
  gap: 2px;
  margin-bottom: 4px;
}
.cal-month-lbl {
  display: flex; align-items: center;
  font-family: 'Oswald', sans-serif; font-size: .7rem; font-weight: 500;
  color: var(--ink); letter-spacing: .06em; text-transform: uppercase;
}
.cal-cell {
  aspect-ratio: 7/5;
  display: flex; align-items: center; justify-content: center;
  border-radius: 2px;
  border: 1px solid var(--rule);
  font-size: clamp(.52rem, 1.2vw, .85rem);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  position: relative;
}
.cal-cell.out-range { opacity: .12; pointer-events: none; }
.cal-cell.spring-break { background: rgba(100,116,139,.1); border-color: rgba(100,116,139,.2); opacity: .5; }
.cal-cell.practice { background: var(--prac); color: var(--prac-text); border-color: var(--prac-border); font-weight: 500; }
.cal-cell.tournament { background: var(--tour); color: var(--tour-text); border: 1px solid var(--tour-border); font-weight: 500; }
.cal-cell.major { background: var(--major); color: var(--major-text); border: 1px solid var(--major-border); font-weight: 500; }
.cal-cell.today-cell { outline: 2px solid var(--accent); outline-offset: 1px; }

.cal-cell[data-tip] { cursor: default; }
.cal-cell[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute;
  top: calc(100% + 5px); left: 50%;
  transform: translateX(-50%);
  background: var(--bg); color: var(--ink);
  border: 1px solid var(--rule);
  font-size: .65rem; font-family: 'DM Sans', sans-serif; font-weight: 400;
  white-space: nowrap; padding: .25rem .5rem;
  border-radius: 2px; z-index: 20; pointer-events: none;
}

/* TOURNAMENT LIST */
.event-list { border-top: 1px solid var(--rule); padding-top: .8rem; margin-bottom: 2rem; }
.event-row {
  display: flex; align-items: baseline; gap: .75rem;
  padding: .35rem 0; border-bottom: 1px solid var(--rule); font-size: .78rem;
}
.event-date { min-width: 5rem; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .73rem; flex-shrink: 0; }
.event-name { flex: 1; color: var(--ink); }
.event-city { display: block; font-size: .68rem; color: var(--muted); margin-top: .05rem; }
.event-badge {
  font-size: .6rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
  padding: .12rem .4rem; border-radius: 2px; flex-shrink: 0;
}
.badge-tour  { background: var(--tour);  color: var(--tour-text);  border: 1px solid var(--tour-border); }
.badge-major { background: var(--major); color: var(--major-text); border: 1px solid var(--major-border); }

/* FOOTER */
footer {
  border-top: 1px solid var(--rule); padding: 2rem 0;
  font-size: .74rem; color: var(--muted);
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem;
}
.footer-logo { font-family: 'Oswald', sans-serif; font-size: .9rem; color: var(--ink); }
</style>

<nav>
  <a href="index.html" class="nav-logo">Wind<span> VBC</span></a>
  <button class="nav-toggle" id="navToggle" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">About the Club</a></li>
    <li><a href="team.html">U13 Team</a></li>
    <li><a href="calendar.html" class="active">Calendar</a></li>
  </ul>
</nav>

<div class="wrap">
  <div class="hero">
    <p class="eyebrow">Wind Volleyball Club · 2026–27 Season</p>
    <h1 class="hero-title">Season Calendar</h1>
  </div>

  <div class="content">
    <div class="main-grid">
      <div class="col-left">
        <p class="section-label">Schedule</p>
        <div class="legend">
          <span class="legend-item"><span class="legend-swatch ls-prac"></span>Practice · 6–8 PM</span>
          <span class="legend-item"><span class="legend-swatch ls-tour"></span>Tournament</span>
          <span class="legend-item"><span class="legend-swatch ls-major"></span>Major</span>
          <span class="legend-item"><span class="legend-swatch ls-sb"></span>Spring Break</span>
        </div>
        <div class="cal-card">
          <div class="cal-inner">
            <div class="cal-hd-row" id="cal-hd"></div>
            <div class="cal-grid" id="cal"></div>
          </div>
        </div>
      </div>

      <div class="col-right">
        <p class="section-label">Tournaments</p>
        <div class="event-list" id="event-rows"></div>
      </div>
    </div>
  </div>

  <footer>
    <span class="footer-logo">Wind Volleyball Club</span>
    <span>© 2026 · Racine, WI</span>
  </footer>
</div>

<script>
  const toggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  toggle.addEventListener('click', () => {
    toggle.classList.toggle('open');
    navLinks.classList.toggle('open');
  });

  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const PRAC_SET = new Set([
    '2026-12-07','2026-12-09','2026-12-14','2026-12-16',
    '2026-12-21','2026-12-23','2026-12-28','2026-12-30',
    '2027-01-04','2027-01-06','2027-01-11','2027-01-13',
    '2027-01-18','2027-01-20','2027-01-25','2027-01-27',
    '2027-02-01','2027-02-03','2027-02-08','2027-02-10',
    '2027-02-15','2027-02-17','2027-02-22','2027-02-24',
    '2027-03-01','2027-03-03','2027-03-08','2027-03-10',
    '2027-03-15','2027-03-17',
    '2027-04-05','2027-04-07','2027-04-12','2027-04-14',
    '2027-04-19','2027-04-21','2027-04-26','2027-04-28',
    '2027-05-03','2027-05-05','2027-05-10','2027-05-12',
  ]);

  const TOURNAMENTS = [
    { name: 'JVC Winter Classic',             start: '2027-01-16', end: '2027-01-17', major: false, city: 'Milwaukee' },
    { name: "WI Jr's January Jam",            start: '2027-01-31', end: '2027-01-31', major: false, city: 'Pleasant Prairie' },
    { name: 'Molten Wisconsin VB Fest',       start: '2027-03-06', end: '2027-03-07', major: false, city: 'Waukesha' },
    { name: 'Badger Regional Championship',   start: '2027-03-13', end: '2027-03-14', major: true,  city: 'Milwaukee' },
    { name: "Mizuno Diggin' in the Dells II", start: '2027-04-10', end: '2027-04-11', major: false, city: 'Wisconsin Dells' },
    { name: 'Cream City Challenge #1',        start: '2027-04-17', end: '2027-04-17', major: false, city: 'New Berlin' },
    { name: 'Cornbelt Showdown',              start: '2027-05-01', end: '2027-05-02', major: false, city: 'Franklin' },
    { name: 'JVC Grand Slam',                 start: '2027-05-15', end: '2027-05-16', major: true,  city: 'West Allis' },
  ];

  function pdate(s) { return new Date(s + 'T12:00:00'); }
  function fmt(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0');
  }

  const TMAP = new Map();
  for (const t of TOURNAMENTS) {
    const s = pdate(t.start), e = pdate(t.end);
    for (const d = new Date(s); d <= e; d.setDate(d.getDate()+1)) TMAP.set(fmt(d), t);
  }

  const TODAY = fmt(new Date());

  function inSeason(m, y) {
    return (m === 11 && y === 2026) || (m >= 0 && m <= 4 && y === 2027);
  }

  function render() {
    document.getElementById('cal-hd').innerHTML =
      '<div></div>' + ['M','T','W','T','F','S','S'].map(d =>
        `<div class="cal-col-hd">${d}</div>`).join('');

    const cal = document.getElementById('cal');
    const calStart = pdate('2026-11-30');
    const calEnd   = pdate('2027-06-06');
    const labeled  = new Set();
    const cur = new Date(calStart);
    let html = '';

    while (cur <= calEnd) {
      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(cur); d.setDate(d.getDate() + i); days.push(d);
      }

      let rowLabel = '';
      for (const d of days) {
        const m = d.getMonth(), y = d.getFullYear();
        if (inSeason(m, y) && d.getDate() === 1) {
          const key = m + '_' + y;
          if (!labeled.has(key)) { rowLabel = MON[m]; labeled.add(key); }
          break;
        }
      }
      html += rowLabel ? `<div class="cal-month-lbl">${rowLabel}</div>` : '<div></div>';

      for (const d of days) {
        const ds = fmt(d);
        const m = d.getMonth(), y = d.getFullYear();
        const active = inSeason(m, y);
        let cls = 'cal-cell', tip = '';

        if (!active) {
          cls += ' out-range';
        } else if (ds >= '2027-03-22' && ds <= '2027-04-04') {
          cls += ' spring-break'; tip = 'Spring Break';
        } else if (PRAC_SET.has(ds)) {
          cls += ' practice'; tip = 'Practice';
        } else if (TMAP.has(ds)) {
          const t = TMAP.get(ds);
          cls += t.major ? ' major' : ' tournament';
          tip = t.name;
        }
        if (ds === TODAY) cls += ' today-cell';

        const ta = tip ? ` data-tip="${tip}"` : '';
        html += `<div class="${cls}"${ta}>${d.getDate()}</div>`;
      }
      cur.setDate(cur.getDate() + 7);
    }
    cal.innerHTML = html;

    let evHtml = '';
    for (const t of TOURNAMENTS) {
      const s = pdate(t.start), e = pdate(t.end);
      const m1 = MON[s.getMonth()], m2 = MON[e.getMonth()];
      const d1 = s.getDate(), d2 = e.getDate();
      const dateStr = t.start === t.end
        ? `${m1} ${d1}`
        : m1 === m2 ? `${m1} ${d1}–${d2}` : `${m1} ${d1} – ${m2} ${d2}`;
      const bc = t.major ? 'badge-major' : 'badge-tour';
      const bl = t.major ? 'Major' : 'Tournament';
      evHtml += `<div class="event-row">
        <span class="event-date">${dateStr}</span>
        <span class="event-name">${t.name}<span class="event-city">${t.city}</span></span>
        <span class="event-badge ${bc}">${bl}</span>
      </div>`;
    }
    document.getElementById('event-rows').innerHTML = evHtml;
  }

  render();
</script>

</body>
</html>
