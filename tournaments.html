<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wind VBC · Tournaments</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:        #0b1f3a;
    --navy2:       #112847;
    --blue:        #1a6fd4;
    --blue2:       #1358b0;
    --sky:         #5aacf5;
    --white:       #ffffff;
    --bg:          #f4f8ff;
    --card:        #ffffff;
    --ink:         #0b1f3a;
    --muted:       #4a6a8a;
    --line:        #dce8f7;
    --win:         #065f46;
    --win-bg:      #ecfdf5;
    --win-border:  #a7f3d0;
    --loss:        #991b1b;
    --loss-bg:     #fef2f2;
    --loss-border: #fecaca;
    --work:        #92400e;
    --work-bg:     #fffbeb;
    --work-border: #fde68a;
    --next-bg:     #eff6ff;
    --next-border: #bfdbfe;
    --next-ink:    #1e40af;
    --sidebar-w:   280px;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── NAV ── */
  nav {
    position: sticky; top: 0; z-index: 200;
    display: flex; align-items: center; justify-content: space-between;
    padding: .9rem 2.5rem;
    background: rgba(11,31,58,.97);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(26,111,212,.25);
  }
  .nav-left { display: flex; align-items: center; gap: 2.5rem; }
  .nav-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: .08em;
    color: var(--white);
    text-decoration: none;
  }
  .nav-logo span { color: var(--sky); }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a {
    text-decoration: none;
    color: rgba(255,255,255,.55);
    font-size: .75rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    transition: color .2s;
  }
  .nav-links a:hover,
  .nav-links a.active { color: var(--white); }
  .nav-right { display: flex; align-items: center; gap: .75rem; }
  .btn-refresh {
    display: flex; align-items: center; gap: .45rem;
    padding: .42rem .9rem;
    background: rgba(90,172,245,.12);
    border: 1px solid rgba(90,172,245,.3);
    border-radius: 4px;
    color: var(--sky);
    font-family: 'DM Sans', sans-serif;
    font-size: .72rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  .btn-refresh:hover { background: rgba(90,172,245,.22); border-color: var(--sky); }
  .btn-refresh.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── LAYOUT ── */
  .shell {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    min-height: calc(100vh - 56px);
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--navy);
    border-right: 1px solid rgba(26,111,212,.2);
    padding: 2rem 0;
    position: sticky;
    top: 56px;
    height: calc(100vh - 56px);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(90,172,245,.2) transparent;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(90,172,245,.2); border-radius: 2px; }

  .sidebar-heading {
    font-size: .62rem;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: rgba(255,255,255,.3);
    padding: 0 1.5rem .75rem;
  }

  .event-list { list-style: none; }
  .event-btn {
    display: block;
    width: 100%;
    padding: .85rem 1.5rem;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    text-align: left;
    cursor: pointer;
    color: rgba(255,255,255,.55);
    font-family: 'DM Sans', sans-serif;
    font-size: .88rem;
    font-weight: 400;
    line-height: 1.4;
    transition: background .18s, color .18s, border-color .18s;
  }
  .event-btn:hover { background: rgba(255,255,255,.05); color: var(--white); }
  .event-btn.on { background: rgba(26,111,212,.15); border-left-color: var(--sky); color: var(--white); }
  .event-btn .ev-name { display: block; font-weight: 500; margin-bottom: .18rem; }
  .event-btn .ev-date { display: block; font-size: .72rem; color: rgba(255,255,255,.35); }
  .event-btn.on .ev-date { color: rgba(255,255,255,.5); }

  .ev-badge {
    display: inline-block;
    font-size: .58rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
    margin-bottom: .3rem;
  }
  .ev-badge.live { background: #ef4444; color: #fff; }
  .ev-badge.next { background: rgba(90,172,245,.2); color: var(--sky); }
  .ev-badge.past { background: rgba(255,255,255,.08); color: rgba(255,255,255,.4); }
  .ev-badge.upcoming { background: rgba(26,111,212,.25); color: rgba(255,255,255,.6); }

  /* ── MAIN CONTENT ── */
  .main {
    padding: 2.5rem 2.5rem 4rem;
    min-width: 0;
  }

  /* Event header */
  .ev-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1.5rem;
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--line);
  }
  .ev-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.8rem, 3vw, 2.8rem);
    line-height: 1;
    letter-spacing: .04em;
    color: var(--ink);
    margin-bottom: .35rem;
  }
  .ev-meta {
    display: flex;
    flex-wrap: wrap;
    gap: .3rem 1rem;
    font-size: .8rem;
    color: var(--muted);
  }
  .ev-meta a { color: var(--blue); text-decoration: none; }
  .ev-meta a:hover { text-decoration: underline; }
  .ev-updated { font-size: .72rem; color: var(--muted); margin-top: .4rem; }

  /* Segment tabs */
  .seg {
    display: inline-flex;
    background: var(--line);
    border-radius: 6px;
    padding: 3px;
    margin-bottom: 1.5rem;
  }
  .seg-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 4px;
    padding: .55rem 1.2rem;
    font-family: 'DM Sans', sans-serif;
    font-size: .8rem;
    font-weight: 500;
    cursor: pointer;
    transition: background .18s, color .18s, box-shadow .18s;
    white-space: nowrap;
  }
  .seg-btn.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(11,31,58,.1); }
  .seg-btn .cnt { font-weight: 300; opacity: .65; margin-left: .3rem; }

  /* Filter pills */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    margin-bottom: 1rem;
  }
  .fbtn {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 999px;
    padding: .38rem .9rem;
    font-family: 'DM Sans', sans-serif;
    font-size: .78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all .18s;
  }
  .fbtn:hover { border-color: var(--blue); color: var(--blue); }
  .fbtn.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .fbtn.ours { border-color: var(--blue); border-width: 2px; }
  .fbtn.ours:not(.on) { color: var(--blue); }
  .fbtn .n { font-weight: 300; opacity: .6; margin-left: .25rem; }
  .fbtn .wd { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); margin-left: 4px; vertical-align: 1px; }

  .fsum { font-size: .78rem; color: var(--muted); margin: -.4rem 0 1rem; }

  /* Search */
  .search {
    width: 100%;
    max-width: 420px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 6px;
    padding: .6rem 1rem;
    font-family: 'DM Sans', sans-serif;
    font-size: .88rem;
    outline: none;
    margin-bottom: 1rem;
    transition: border-color .2s, box-shadow .2s;
  }
  .search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,111,212,.1); }

  /* Team cards grid */
  .teams-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
    gap: 1.5rem;
  }

  /* Team card */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(11,31,58,.06);
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem 1.4rem .9rem;
    border-bottom: 1px solid var(--line);
    gap: 1rem;
  }
  .card-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    letter-spacing: .05em;
    display: flex;
    align-items: center;
    gap: .6rem;
  }
  .color-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .card-div { font-size: .72rem; color: var(--muted); margin-top: .15rem; }
  .card-rank { text-align: right; flex-shrink: 0; }
  .card-rank b { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; line-height: 1; letter-spacing: .04em; display: block; }
  .card-rank small { font-size: .68rem; color: var(--muted); }

  /* Next game banner */
  .next-banner {
    margin: .9rem 1.1rem;
    padding: .9rem 1.1rem;
    border-radius: 8px;
    background: var(--next-bg);
    border: 1px solid var(--next-border);
  }
  .next-banner.work {
    background: var(--work-bg);
    border-color: var(--work-border);
  }
  .next-lbl {
    font-size: .62rem;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--next-ink);
    margin-bottom: .3rem;
  }
  .next-banner.work .next-lbl { color: var(--work); }
  .next-time {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: .05em;
    line-height: 1;
  }
  .next-vs { font-size: .9rem; font-weight: 500; margin-top: .2rem; }
  .next-detail { font-size: .75rem; color: var(--muted); margin-top: .25rem; }

  .waiting-note {
    margin: .9rem 1.1rem;
    padding: .75rem 1rem;
    border: 1px dashed var(--line);
    border-radius: 8px;
    font-size: .8rem;
    color: var(--muted);
  }

  /* Game rows */
  .day-header {
    padding: .5rem 1.4rem .3rem;
    font-size: .65rem;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--bg);
    border-top: 1px solid var(--line);
  }
  .play-header {
    padding: .4rem 1.4rem 0;
    font-size: .72rem;
    color: var(--muted);
    font-weight: 500;
  }
  .game-row {
    display: grid;
    grid-template-columns: 72px 1fr auto;
    gap: .75rem;
    padding: .75rem 1.4rem;
    align-items: center;
    border-top: 1px solid var(--line);
  }
  .play-header + .game-row { border-top: 0; }
  .game-row.is-next { box-shadow: inset 3px 0 0 var(--blue); }
  .game-time {
    font-size: .82rem;
    font-weight: 500;
    white-space: nowrap;
  }
  .game-court { font-size: .68rem; color: var(--muted); margin-top: .1rem; }
  .game-opp { font-size: .9rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
  .game-opp.work { color: var(--work); }
  .game-label { font-size: .72rem; color: var(--muted); margin-top: .1rem; }
  .game-result { text-align: right; }
  .pill {
    display: inline-block;
    font-size: .68rem;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .pill.w { background: var(--win-bg); color: var(--win); border: 1px solid var(--win-border); }
  .pill.l { background: var(--loss-bg); color: var(--loss); border: 1px solid var(--loss-border); }
  .pill.k { background: var(--work-bg); color: var(--work); border: 1px solid var(--work-border); }
  .pill.u { background: var(--next-bg); color: var(--next-ink); border: 1px solid var(--next-border); }
  .sets { display: block; font-size: .7rem; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }

  /* Field view — division table */
  .field-wrap { max-width: 760px; }
  .div-table {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(11,31,58,.06);
  }
  .div-table-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 1rem 1.4rem;
    border-bottom: 1px solid var(--line);
    gap: 1rem;
  }
  .div-table-head b {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.25rem;
    letter-spacing: .05em;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .div-table-head small { font-size: .75rem; color: var(--muted); }
  .team-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: .65rem 1.4rem;
    border-top: 1px solid var(--line);
    gap: 1rem;
  }
  .team-row:first-of-type { border-top: 0; }
  .team-row.ours { background: var(--next-bg); }
  .team-row.ours .team-name::after {
    content: "WIND";
    font-size: .6rem;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--blue);
    margin-left: .5rem;
    vertical-align: 1px;
  }
  .team-row.dropped .team-name { opacity: .45; text-decoration: line-through; }
  .team-name { font-size: .88rem; font-weight: 500; }
  .team-club { font-size: .75rem; color: var(--muted); text-align: right; flex: 0 1 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team-rank { font-family: 'Bebas Neue', sans-serif; font-size: .95rem; letter-spacing: .04em; color: var(--muted); min-width: 2.8rem; flex-shrink: 0; text-align: right; }
  .team-rank.ours { color: var(--blue); }
  .team-rank small { font-family: 'DM Sans', sans-serif; font-size: .6rem; letter-spacing: .06em; text-transform: uppercase; display: block; }
  .team-row[hidden] { display: none; }
  .no-match { padding: .9rem 1.4rem; font-size: .82rem; color: var(--muted); }

  /* Status pill */
  .sp {
    display: inline-block;
    font-size: .65rem;
    font-weight: 700;
    letter-spacing: .06em;
    border-radius: 4px;
    padding: 3px 7px;
    flex-shrink: 0;
  }
  .sp.acc { background: var(--win-bg); color: var(--win); }
  .sp.pen { background: var(--work-bg); color: var(--work); }
  .sp.oth { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }

  /* Reg note */
  .reg-note {
    margin: .9rem 1.1rem;
    padding: .9rem 1.1rem;
    border-radius: 8px;
    background: var(--next-bg);
    border: 1px solid var(--next-border);
    font-size: .85rem;
  }
  .reg-note b { display: block; font-size: .9rem; margin-bottom: .2rem; }
  .reg-note small { display: block; color: var(--muted); font-size: .78rem; margin-top: .5rem; }

  /* Empty / error states */
  .empty-state {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 3rem 2rem;
    text-align: center;
    color: var(--muted);
    max-width: 480px;
  }
  .empty-state b { display: block; font-size: 1rem; color: var(--ink); margin-bottom: .5rem; }
  .err-box {
    background: var(--loss-bg);
    color: var(--loss);
    border: 1px solid var(--loss-border);
    border-radius: 8px;
    padding: .9rem 1.2rem;
    font-size: .85rem;
    margin-bottom: 1.5rem;
  }
  .demo-box {
    background: var(--work-bg);
    color: var(--work);
    border: 1px solid var(--work-border);
    border-radius: 8px;
    padding: .75rem 1.1rem;
    font-size: .82rem;
    margin-bottom: 1.5rem;
  }

  /* Skeleton */
  .skel {
    height: 180px;
    border-radius: 10px;
    margin-bottom: 1.5rem;
    background: linear-gradient(90deg, var(--card), var(--line), var(--card));
    background-size: 200% 100%;
    animation: sh 1.2s infinite;
  }
  @keyframes sh { to { background-position: -200% 0; } }

  /* Footer */
  .page-footer {
    border-top: 1px solid var(--line);
    padding: 1.2rem 2.5rem;
    font-size: .72rem;
    color: var(--muted);
    background: var(--card);
  }
</style>
</head>

</div>

function keyFromId(id){
  const b = btoa("=" + String(id).padStart(10, "0") + "=");
  const pad = (b.match(/=+$/) || [""])[0].length;
  return b.replace(/=+$/, "").replace(/\+/g, "-").replace(/\//g, "_") + pad;
}
function eventKey(e){
  const v = String(e.aes || "").trim();
  if (!v) return null;
  const m = v.match(/event\/([A-Za-z0-9_-]{8,})/);
  if (m) return m[1];
  if (/^\d+$/.test(v)) return keyFromId(v);
  if (/^[A-Za-z0-9_-]{8,}$/.test(v)) return v;
  return null;
}

  const d = new Date(+m[1], +m[2]-1, +m[3]);

const fmtTime = p => { if (!p || p.h==null) return ""; const h = p.h % 12 || 12; return h + ":" + String(p.mi).padStart(2,"0") + (p.h < 12 ? " AM" : " PM"); };
const fmtDay  = p => p ? `${DOW[p.dow]}, ${MON[p.mo]} ${p.d}` : "";
function fmtRange(a, b){
  const s = parts(a), e = parts(b); if (!s) return "";
  if (!e || s.day === e.day) return `${MON[s.mo]} ${s.d}, ${s.y}`;
  if (s.mo === e.mo) return `${MON[s.mo]} ${s.d}–${e.d}, ${s.y}`;
  return `${MON[s.mo]} ${s.d} – ${MON[e.mo]} ${e.d}, ${e.y}`;
}
function todayStr(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function statusOf(e){
  if (DEMO && e._demo) return "live";
  const t = todayStr();
  if (e.start <= t && t <= (e.end || e.start)) return "live";
  return e.start > t ? "upcoming" : "past";
}

async function get(path){
  const r = await fetch(CONFIG.proxy.replace(/\/$/, "") + path);
  if (r.status === 204) return null;
  if (!r.ok) { const e = new Error("AES returned " + r.status); e.status = r.status; throw e; }
  return r.json();
}
const getEvent = key => DEMO ? Promise.resolve({ ...DEMO_DATA.event, Divisions: DEMO_FIELD.divisions }) : get(`/api/event/${key}`);
async function getDivisionTeams(key, divId){
  if (DEMO) {
    const rows = DEMO_FIELD.teams[divId];
    if (!rows) return null;
    return rows.map(([id, name, clubId]) => ({ id, name, clubId, club: DEMO_FIELD.clubs[clubId] || "" }));
  }
  const r = await get(`/odata/${key}/nextassignments(dId=${divId},cId=null,tIds=[])?$orderby=TeamName,TeamCode&$select=TeamId,TeamName,TeamCode,TeamClub`);
  return (r && r.value ? r.value : []).map(t => ({ id: t.TeamId, name: t.TeamName, clubId: t.TeamClub?.ClubId, club: t.TeamClub?.Name || "" }));
}
const REG_COLORS = ["#5F9FFF","#FF5F7F","#3CC48C","#B57BFF","#F5A623","#4FC3D9","#E86FB8","#9AA84B"];
function eventNumber(e){
  const v = String(e.aes || "").trim();
  if (/^\d+$/.test(v)) return v;
  const k = eventKey(e); if (!k) return null;
  try {
    const pad = +k.slice(-1);
    const m = atob(k.slice(0,-1).replace(/-/g,"+").replace(/_/g,"/")+"=".repeat(pad)).match(/\d+/);
    return m ? String(+m[0]) : null;
  } catch { return null; }
}
async function getRegistration(num){
  const [d, t] = await Promise.all([get(`/reg/events/${num}/divisions`), get(`/reg/events/${num}/teams`)]);
  const divisions = ((d && d.value) || []).map((x,i) => ({ id: x.eventDivisionAssignmentId, name: x.description, max: x.maximumTeams || null }));
  const teams = ((t && t.value) || []).filter(x => !(x.acceptedType && x.acceptedType.hidden)).map(x => ({
    id: x.teamId, name: x.name, clubId: x.clubId, club: x.clubName || "", code: String(x.teamCode || "").toLowerCase(),
    divId: x.eventDivisionAssignmentId, div: x.divisionDescription || "", status: (x.acceptedType && x.acceptedType.displayName) || "Registered" }));
  for (const tm of teams) if (!divisions.some(v => v.id === tm.divId)) divisions.push({ id: tm.divId, name: tm.div, max: null });
  divisions.forEach((v,i) => v.color = REG_COLORS[i % REG_COLORS.length]);
  return { divisions, teams };
}
const isDropped = t => /drop|withdr|cancel/i.test(t.status);
function regClubId(){
  const reg = state.reg; if (!reg) return null;
  const codes = (CONFIG.teamCodes || []).map(c => String(c).toLowerCase());

function regOurs(){ const c = regClubId(); return c == null ? [] : state.reg.teams.filter(t => t.clubId === c && !isDropped(t)); }
function regDivStats(divId){
  const d = state.reg.divisions.find(v => v.id === divId) || { name:"", max:null, color:"var(--blue)" };
  const list = state.reg.teams.filter(t => t.divId === divId);

  const active = list.filter(t => !isDropped(t)).length;
  return { ...d, list, acc, pen, active };
}
const statusPill = st => `<span class="sp ${/accept/i.test(st) ? "acc" : /pend/i.test(st) ? "pen" : "oth"}">${esc(st)}</span>`;

async function getTeamData(key, divId, teamId){
  if (DEMO) return demoTeam(teamId);
  const base = `/api/event/${key}/division/${divId}/team/${teamId}/schedule/`;
  const safe = p => p.catch(() => null);
  const [past, current, work, future, standings] = await Promise.all([
    safe(get(base+"past")), safe(get(base+"current")), safe(get(base+"work")), safe(get(base+"future")),
    safe(get(`/odata/${key}/standings(dId=${divId},cId=null,tIds=[${teamId}])`)),
  ]);
  return { past: past||[], current: current||[], work: work||[], future: Array.isArray(future) ? future[0] : future,
           standing: standings && standings.value ? standings.value.find(s => s.TeamId === teamId) : null };
}

function demoTeam(teamId){
  const raw = JSON.parse(JSON.stringify(DEMO_DATA.teams[teamId]));
  const pool = raw.past.slice(0,3), cross = raw.past.slice(3,5);
  const pending = cross[1].Match;
  pending.HasScores = false; pending.FirstTeamWon = false; pending.SecondTeamWon = false;
  pending.Sets.forEach(s => { s.FirstTeamScore = null; s.SecondTeamScore = null; });
  const work = JSON.parse(JSON.stringify(cross[1]));
  Object.assign(work.Match, { MatchId: pending.MatchId-1000, FirstTeamId:1, FirstTeamName:"Kingtide 14-2 Black",
    SecondTeamId:2, SecondTeamName:"WVE 14-3", WorkTeamId:teamId, ScheduledStartDateTime:"2025-01-12T16:15:00", MatchShortName:"M6", MatchFullName:"Match 6" });
  return { past:pool, current:[{ Play:cross[0].Play, PlayType:1, Matches:cross.map(c=>c.Match) }],
           work: teamId===208223 ? [work] : [],
           future:{ NextPendingReseed:true, NextPlay:{ FullName:"Gold Bracket" }, PotentialRankText:null },
           standing: raw.standings[0] };
}

const gameLabel = s => String(s||"").replace(/^Match/i,"Game").replace(/^M(\d+)$/i,"G$1");
function toGame(m, play, teamId){
  if (!m || m.MatchId==null) return null;
  const usFirst = m.FirstTeamId===teamId, usSecond = m.SecondTeamId===teamId;
  const isWork = !usFirst && !usSecond;
  const sets = (m.Sets||[]).filter(s=>s.FirstTeamScore!=null&&s.SecondTeamScore!=null)
    .map(s => usFirst||isWork ? [s.FirstTeamScore,s.SecondTeamScore] : [s.SecondTeamScore,s.FirstTeamScore]);
  const done = !!(m.FirstTeamWon||m.SecondTeamWon);
  const won = usFirst ? m.FirstTeamWon : m.SecondTeamWon;
  const setW = sets.filter(([a,b])=>a>b).length, setL = sets.length-setW;
  return {
    id:m.MatchId, isWork, done, won, sets, setW, setL,
    when: parts(m.ScheduledStartDateTime),
    court: m.Court ? m.Court.Name : "",
    label: gameLabel(m.MatchShortName||m.MatchFullName),
    play: play ? (play.FullName||play.ShortName||"") : "",
    opp: isWork ? `${stripRegion(m.FirstTeamName)} vs ${stripRegion(m.SecondTeamName)}`
                : stripRegion(usFirst ? (m.SecondTeamName||m.SecondTeamText) : (m.FirstTeamName||m.FirstTeamText)) || "TBD",
    workTeam: !isWork && m.WorkTeamText ? stripRegion(m.WorkTeamText) : "",
  };
}
function collectGames(d, teamId){
  const map = new Map();
  const add = (m, play) => { const g = toGame(m,play,teamId); if (g && !map.has(g.id)) map.set(g.id,g); };
  (d.past||[]).forEach(x=>add(x.Match,x.Play));
  (d.current||[]).forEach(x=>(x.Matches||(x.Match?[x.Match]:[])).forEach(m=>add(m,x.Play)));
  (d.work||[]).forEach(x=>add(x.Match,x.Play));
  if (d.future){ add(d.future.NextMatch,d.future.NextPlay); add(d.future.WorkMatch,d.future.NextPlay); }
  return [...map.values()].sort((a,b)=>(a.when?.sort||"").localeCompare(b.when?.sort||"")||a.isWork-b.isWork);
}

function renderTeam(t){
  const d = state.data[t.TeamId]; if (!d) return `<div class="skel"></div>`;
  const games = collectGames(d,t.TeamId);
  const playing = games.filter(g=>!g.isWork);
  const next = games.find(g=>!g.done&&!g.isWork)||null;
  const nextWork = games.find(g=>g.isWork&&!g.done&&(!next||(g.when?.sort||"")<(next.when?.sort||"")))||null;
  const focus = nextWork||next;

  const W = playing.filter(g=>g.done&&g.won).length, L = playing.filter(g=>g.done&&!g.won).length;
  const st = d.standing, div = t.TeamDivision||{};
  const rankHtml = st&&st.OverallRank
    ? `<b>${esc(st.FinishRankText||st.OverallRank)}</b><small>of ${esc(div.TeamCount||st.Division?.TeamCount||"")}</small>`
    : (W+L) ? `<b>${W}–${L}</b><small>games</small>` : "";

  let focusHtml = "";
  if (focus){
    focusHtml = `<div class="next-banner ${focus.isWork?"work":""}">
      <div class="next-lbl">${focus.isWork?"Next up · Work":"Next game"}</div>
      <div class="next-time">${esc(fmtTime(focus.when))}${focus.court?` · ${esc(focus.court)}`:""}</div>
      <div class="next-vs">${focus.isWork?"Work "+esc(focus.opp):"vs "+esc(focus.opp)}</div>
      <div class="next-detail">${esc(fmtDay(focus.when))}${focus.play?" · "+esc(focus.play):""}${focus.workTeam?" · Work team: "+esc(focus.workTeam):""}</div>
    </div>`;
  } else if (d.future&&(d.future.NextPendingReseed||d.future.NextPlay)){
    const np = d.future.NextPlay?esc(d.future.NextPlay.FullName||""):"";
    focusHtml = `<div class="waiting-note">Waiting on results for the next round${np?` (${np})`:""}.  Check back after the current pools finish.</div>`;
  }

  let rows="", lastDay="", lastPlay="";
  for (const g of games){
    const day = g.when?g.when.day:"";
    if (day!==lastDay){ rows+=`<div class="day-header">${esc(fmtDay(g.when))}</div>`; lastDay=day; lastPlay=""; }
    if (!g.isWork&&g.play!==lastPlay){ rows+=`<div class="play-header">${esc(g.play)}</div>`; lastPlay=g.play; }
    let res;
    if (g.isWork) res=`<span class="pill k">Work</span>`;
    else if (g.done) res=`<span class="pill ${g.won?"w":"l"}">${g.won?"W":"L"} ${g.setW}–${g.setL}</span><span class="sets">${g.sets.map(s=>s.join("-")).join(", ")}</span>`;
    else res=`<span class="pill u">${g===next?"Next":"–"}</span>`;
    rows+=`<div class="game-row ${g===focus?"is-next":""}" >
      <div><div class="game-time">${esc(fmtTime(g.when))}</div><div class="game-court">${esc(g.court)}</div></div>
      <div><div class="game-opp ${g.isWork?"work":""}">${g.isWork?"Work: ":"vs "}${esc(g.opp)}</div><div class="game-label">${esc(g.label)}${g.workTeam?" · Work: "+esc(g.workTeam):""}</div></div>
      <div class="game-result">${res}</div>
    </div>`;
  }
  if (!games.length) rows=`<div class="waiting-note" style="margin:.75rem 1.1rem">No games posted yet. AES usually publishes pools a few days before the tournament.</div>`;

  return `<div class="card">
    <div class="card-head">
      <div>
        <div class="card-name"><span class="color-dot" style="background:${esc(div.ColorHex||"var(--blue)")}"></span>${esc(stripRegion(t.TeamName))}</div>
        <div class="card-div">${esc(div.Name||"")}${(W+L)&&st?` · ${W}–${L} record here`:""}</div>
      </div>
      <div class="card-rank">${rankHtml}</div>
    </div>
    ${focusHtml}${rows}
  </div>`;
}

function renderField(divs, totalTeams){

  const sortedDivs=[...divs].sort((a,b)=>(parseInt(a.Name)||999)-(parseInt(b.Name)||999));
  let html=`<div class="fsum">${divs.length} division${divs.length===1?"":"s"} · ${totalTeams} teams</div>`;
  html+=`<div class="filters">${sortedDivs.map(x=>`<button class="fbtn ${x.DivisionId===state.divSel?"on":""} ${ours.has(x.DivisionId)?"ours":""}" data-d="${x.DivisionId}">${esc(x.Name)}<span class="n">${x.TeamCount??""}</span>${ours.has(x.DivisionId)?`<span class="wd"></span>`:""}</button>`).join("")}</div>`;
  const list=state.field[d.DivisionId];
  if (list===undefined){ loadDivision(d.DivisionId); return html+`<div class="skel"></div>`; }
  if (list===null) return html+`<div class="empty-state"><b>${DEMO?"Not in the demo sample":"Couldn't load this division"}</b>${DEMO?"Demo only carries 12 & 14 Girls.":"Tap Refresh to try again."}</div>`;
  const clubId=state.club?.ClubId, sorted=[...list].sort((a,b)=>(b.clubId===clubId)-(a.clubId===clubId)||a.name.localeCompare(b.name));
  const nClubs=new Set(list.map(t=>t.clubId)).size, nOurs=list.filter(t=>t.clubId===clubId).length;
  html+=`<input class="search" id="q" type="search" placeholder="Search ${esc(d.Name)} teams or clubs…" value="${esc(state.q)}" autocomplete="off">`;
  html+=`<div class="field-wrap"><div class="div-table">
    <div class="div-table-head"><b><span class="color-dot" style="background:${esc(d.ColorHex||"var(--blue)")}"></span>${esc(d.Name)}</b>
      <small>${list.length} teams · ${nClubs} clubs${nOurs?` · ${nOurs} Wind`:""}</small></div>`;
  const rankMap2=state.rankings[d.DivisionId];
  const rankLoading2=state._rankLoading.has(d.DivisionId);
  html+=sorted.map(t=>{
    const r=rankMap2&&rankMap2.get(t.id);
    const rankHtml=rankLoading2?`<div class="team-rank"><small>ranking…</small></div>`
      :r?`<div class="team-rank ${t.clubId===clubId?"ours":""}">#${r.nat||r.reg}<small>nat rank</small></div>`
      :``;
    return `<div class="team-row ${t.clubId===clubId?"ours":""}" data-s="${esc((t.name+" "+t.club).toLowerCase())}">
      <div class="team-name">${esc(stripRegion(t.name))}</div>${rankHtml}<div class="team-club">${esc(t.club)}</div></div>`;
  }).join("");
  if (!list.length) html+=`<div class="no-match">No teams registered yet.</div>`;
  html+=`<div class="no-match" id="nomatch" hidden>No teams match.</div></div></div>`;
  return html;
}

function applySearch(){
  const q=state.q.trim().toLowerCase(); let shown=0;
  document.querySelectorAll(".team-row").forEach(el=>{ const hit=!q||el.dataset.s.includes(q); el.hidden=!hit; if(hit) shown++; });
  const nm=$("#nomatch"); if(nm) nm.hidden=shown>0||!document.querySelector(".team-row");
}

async function loadDivision(divId){
  if (state.field[divId]!==undefined||state._divLoading===divId) return;
  state._divLoading=divId; const idx=state.idx;
  const key=DEMO?DEMO_DATA.event.Key:eventKey(CONFIG.events[idx]);
  let list; try{ list=await getDivisionTeams(key,divId); }catch{ list=null; }
  state._divLoading=null; if(state.idx!==idx) return;
  state.field[divId]=list; if(state.view==="field") renderMain();
  if (list && list.length) loadRankings(divId, list.map(t=>t.id));
}

const AES_RANK = "https://www.advancedeventsystems.com/api/ranking";
async function loadRankings(divId, teamIds){
  if (DEMO || state.rankings[divId]!==undefined || state._rankLoading.has(divId)) return;
  if (!teamIds || !teamIds.length) return;
  state._rankLoading.add(divId);
  try {
    const meta = await fetch(`${AES_RANK}/${teamIds[0]}`).then(r=>r.ok?r.json():null);
    if (!meta) { state.rankings[divId]=null; return; }
    const gcId=meta.genderClassTypeId, dtId=meta.divisionType?.divisionTypeId;
    if (!gcId||!dtId) { state.rankings[divId]=null; return; }
    const seasonYear = new Date().getMonth() >= 6 ? new Date().getFullYear() : new Date().getFullYear()-1;
    const data = await fetch(`${AES_RANK}/${gcId}/${dtId}/${seasonYear}/national/aes`,
      {headers:{Accept:"application/json"}}).then(r=>r.ok?r.json():null);
    if (!data || !data.value) { state.rankings[divId]=null; return; }
    const map = new Map();
    for (const t of data.value) {
      const nat=t.national?.current?.rank, reg=t.regional?.current?.rank;
      if (nat!=null||reg!=null) map.set(t.teamId, {nat, reg});
    }
    state.rankings[divId]=map;
  } catch { state.rankings[divId]=null; }
  finally {
    state._rankLoading.delete(divId);
    if (state.view==="field" && state.divSel===divId) renderMain();
  }
}

const NOT_POSTED = `<div class="empty-state"><b>Schedule not posted yet</b>The tournament is in AES but the schedule isn't public yet. It'll appear here automatically once the director publishes it, usually a few days before.</div>`;

async function load(idx, quiet){
  if (state.loading) return;
  const changed=idx!==state.idx; state.idx=idx;
  if (changed){ state.event=null; state.teams=[]; state.data={}; state.updated=null; state.club=null; state.field={}; state.divSel=null; state.q=""; state.reg=null; state.st="all"; state.rankings={}; state._rankLoading=new Set(); }
  renderSidebar();
  const e=CONFIG.events[idx];
  if (DEMO) e._demo=true;
  const key=DEMO?DEMO_DATA.event.Key:eventKey(e);
  try{ history.replaceState(null,"","?t="+idx+(qs.has("demo")?"&demo":"")); }catch{}
  if (!key){ renderMain(NOT_POSTED); return; }
  if (!quiet) renderMain(`<div class="skel"></div><div class="skel"></div>`);
  state.loading=true; $("#refresh").classList.add("spin");
  const num=DEMO?null:eventNumber(e);
  const regP=num?getRegistration(num).catch(()=>null):Promise.resolve(null);
  const stamp=()=>state.updated=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  try{
    const ev=await getEvent(key).catch(async err=>{
      if (err.status===404){ state.event=null; state.reg=await regP; throw Object.assign(err,{unpublished:true}); }
      throw err;
    });
    state.reg=await regP; state.event=ev;
    const clubs=(ev&&ev.Clubs)||[]; let club=null;
    if (!DEMO&&CONFIG.teamCodes&&CONFIG.teamCodes.length){
      const found=await findTeamsByCode(key,CONFIG.teamCodes).catch(()=>[]);
      if (found.length&&found[0].TeamClub) club=found[0].TeamClub;
    }
    if (!club&&CONFIG.clubId) club=clubs.find(c=>c.ClubId===CONFIG.clubId)||null;
    if (!club) club=clubs.find(c=>CONFIG.clubNamePattern.test(c.Name||""))||(DEMO?clubs[0]:null);
    state.club=club||null;
    if (!club){ state.teams=[]; if(!store.get("view")&&!regOurs().length) state.view="field"; stamp(); renderMain(); return; }
    $("#foot").textContent=`${club.Name} · AES club ID ${club.ClubId}`;
    const teams=await getClubTeams(key,club.ClubId); state.teams=teams||[];
    if (!quiet||!state.teams.length) renderMain();
    if (!state.teams.length) return;
    const results=await Promise.all(state.teams.map(t=>getTeamData(key,t.TeamDivision?.DivisionId,t.TeamId).catch(()=>null)));
    state.teams.forEach((t,i)=>{ if(results[i]) state.data[t.TeamId]=results[i]; });
    stamp(); renderMain();
  } catch(err){
    if (err.unpublished){
      if (state.reg){ const c=regClubId(); const t=c!=null&&state.reg.teams.find(x=>x.clubId===c); if(t) $("#foot").textContent=`${t.club} · AES club ID ${t.clubId}`; stamp(); }
      renderMain(state.reg?undefined:NOT_POSTED); return;
    }
    renderMain(`<div class="err-box">Couldn't reach AES right now (${esc(err.message)}). Try refreshing in a moment.</div>`+(state.teams.length?`<div class="teams-grid">`+state.teams.map(renderTeam).join("")+`</div>`:""));
  } finally{
    state.loading=false; $("#refresh").classList.remove("spin"); scheduleRefresh();
  }
}
function scheduleRefresh(){
  clearTimeout(state.timer);
  const e=CONFIG.events[state.idx];
  if (!DEMO&&e&&statusOf(e)==="live"&&eventKey(e))
    state.timer=setTimeout(()=>{ if(!document.hidden) load(state.idx,true); else scheduleRefresh(); },CONFIG.refreshSeconds*1000);
}

$("#events").addEventListener("click", ev=>{ const b=ev.target.closest("[data-i]"); if(b) load(+b.dataset.i); });
$("#app").addEventListener("click", ev=>{
  const v=ev.target.closest("[data-v]"); if(v){ state.view=v.dataset.v; store.set("view",state.view); renderMain(); return; }
  const d=ev.target.closest("[data-d]"); if(d){ state.divSel=+d.dataset.d; state.q=""; state.st="all"; renderMain(); return; }
  const st=ev.target.closest("[data-st]"); if(st){ state.st=st.dataset.st; renderMain(); return; }
  const b=ev.target.closest("[data-f]"); if(!b) return;
  state.filter=b.dataset.f; store.set("filter",state.filter); renderMain();
});
$("#app").addEventListener("input", ev=>{ if(ev.target.id==="q"){ state.q=ev.target.value; applySearch(); } });
$("#refresh").addEventListener("click", ()=>{ state.field={}; load(state.idx,true); });
document.addEventListener("visibilitychange",()=>{
  if (!document.hidden&&CONFIG.events[state.idx]&&statusOf(CONFIG.events[state.idx])==="live") load(state.idx,true);
});

load(DEMO?0:defaultIdx());
</script>
