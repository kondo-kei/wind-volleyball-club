<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wind VBC · Practices</title>
  <!-- App install (home screen) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0b1f3a">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wind VBC">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0b1f3a;
      --surf:         #0d2448;
      --ink:          #f0f5ff;
      --muted:        rgba(200,220,255,.65);
      --rule:         rgba(90,172,245,.12);
      --accent:       #c9a84c;
      --sky:          #5aacf5;
      --amber:        #fbbf24;
      --amber-bg:     rgba(251,191,36,.1);
      --amber-border: rgba(251,191,36,.25);
      color-scheme: dark;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--ink); font-family: 'DM Sans', sans-serif; font-weight: 300; line-height: 1.6; min-height: 100vh; }

    /* ── NAV ── */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: .9rem 2.5rem;
      background: rgba(11,31,58,.97);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(90,172,245,.2);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { font-family: 'Oswald', sans-serif; font-size: 1.5rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); text-decoration: none; }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; color: rgba(240,245,255,.45); font-weight: 500; transition: color .2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--ink); }
    @media (max-width: 600px) { nav { padding: .8rem 1.25rem; } }

    /* ── PAGE HEADER ── */
    .page-header {
      padding: 2.5rem 2.5rem 2rem;
      border-bottom: 1px solid var(--rule);
      max-width: 760px;
    }
    .eyebrow { font-size: .65rem; letter-spacing: .26em; text-transform: uppercase; color: var(--accent); margin-bottom: .5rem; font-weight: 500; }
    .page-title { font-family: 'Oswald', sans-serif; font-size: clamp(1.8rem, 5vw, 2.8rem); font-weight: 400; line-height: 1.05; letter-spacing: .04em; text-transform: uppercase; margin-bottom: .5rem; }
    .page-sub { font-size: .88rem; color: var(--muted); }
    .page-facts { font-size: .8rem; color: var(--muted); margin-top: .4rem; opacity: .8; }
    @media (max-width: 600px) { .page-header { padding: 1.5rem 1.25rem 1.25rem; } }

    /* ── CONTENT ── */
    .content { padding: 2rem 2.5rem 5rem; max-width: 760px; }
    @media (max-width: 600px) { .content { padding: 1.5rem 1.25rem 4rem; } }

    /* ── LEGEND ── */
    .legend {
      display: flex; flex-wrap: wrap; gap: .5rem 1.8rem;
      margin-bottom: 2rem;
      padding: .75rem 1rem;
      background: var(--surf); border: 1px solid var(--rule); border-radius: 6px;
      font-size: .78rem; color: var(--muted); align-items: center;
    }
    .legend-item { display: flex; align-items: center; gap: .5rem; }

    /* ── CHIPS ── */
    .chip {
      display: inline-flex; align-items: center; gap: .22rem;
      font-size: .64rem; font-weight: 500; letter-spacing: .07em; text-transform: uppercase;
      padding: .17rem .48rem; border-radius: 3px; white-space: nowrap; flex-shrink: 0;
    }
    .chip-fh     { background: rgba(90,172,245,.14); color: var(--sky); border: 1px solid rgba(90,172,245,.32); }
    .chip-unconf { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
    .chip-jac    { background: rgba(240,245,255,.06); color: var(--muted); border: 1px solid var(--rule); }

    /* ── MONTH SECTION ── */
    .month { margin-bottom: 2.5rem; }
    .month-hd { display: flex; align-items: baseline; gap: 1rem; padding-bottom: .5rem; border-bottom: 2px solid var(--accent); }
    .month-nm { font-family: 'Oswald', sans-serif; font-size: 1.4rem; font-weight: 400; letter-spacing: .06em; }
    .month-ct { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

    /* ── COLUMN HEADERS ── */
    .col-heads { display: grid; grid-template-columns: 1fr 1fr; }
    .col-head { padding: .35rem .75rem; font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--rule); }

    /* ── WEEK PAIR ── */
    .week-pair { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--rule); }

    /* ── DAY CELL ── */
    .day-cell {
      display: flex; align-items: center; gap: .55rem;
      padding: .58rem .75rem;
      font-size: .88rem;
      min-height: 2.5rem;
    }
    .day-cell + .day-cell { border-left: 1px solid var(--rule); }
    .day-cell.past { opacity: .3; }
    .day-cell.next-up { background: rgba(201,168,76,.08); box-shadow: inset 3px 0 0 var(--accent); }
    .day-cell.next-up + .day-cell.next-up { box-shadow: none; }
    .cell-day { font-size: .63rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); min-width: 1.7rem; flex-shrink: 0; }
    .cell-date { flex: 1; font-weight: 400; font-variant-numeric: tabular-nums; }
    .next-tag { font-size: .58rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 500; background: rgba(201,168,76,.12); padding: .13rem .38rem; border-radius: 3px; flex-shrink: 0; }

    /* ── MOBILE: collapse to single column ── */
    @media (max-width: 500px) {
      .col-heads { display: none; }
      .week-pair { grid-template-columns: 1fr; }
      .day-cell + .day-cell { border-left: none; border-top: 1px solid var(--rule); }
      .day-cell.empty { display: none; }
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--rule);
      padding: 1.5rem 2.5rem;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .5rem;
      font-size: .74rem; color: var(--muted);
    }
    .footer-logo { font-family: 'Oswald', sans-serif; font-size: .9rem; color: var(--ink); }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Wind<span> VBC</span></a>
    <ul class="nav-links">
      <li><a href="index.html">About the Club</a></li>
      <li><a href="team.html">U13 Team</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <p class="eyebrow">2026–27 Season</p>
    <h1 class="page-title">Practice Schedule</h1>
    <p class="page-sub">Mon &amp; Wed · 6–8 PM · The Prairie School</p>
    <p class="page-facts" id="page-facts"></p>
  </div>

  <div class="content">

    <div class="legend">
      <span class="legend-item">
        <span class="chip chip-jac">JAC</span>
        Johnson Athletic Complex
      </span>
      <span class="legend-item">
        <span class="chip chip-fh">✓ Fieldhouse</span>
        confirmed venue change
      </span>
      <span class="legend-item">
        <span class="chip chip-unconf">Fieldhouse · ?</span>
        venue unconfirmed
      </span>
    </div>

    <div id="schedule"></div>

  </div>

  <footer>
    <span class="footer-logo">Wind Volleyball Club</span>
    <span>© 2026 · Racine, WI</span>
  </footer>

  <script>
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    const PRACTICES = [
      // December 2026
      {d:'2026-12-07'}, {d:'2026-12-09'},
      {d:'2026-12-14', venue:'Fieldhouse', conf:true}, {d:'2026-12-16'},
      {d:'2026-12-21'}, {d:'2026-12-23'},
      {d:'2026-12-28'}, {d:'2026-12-30'},
      // January 2027
      {d:'2027-01-04'}, {d:'2027-01-06'},
      {d:'2027-01-11'}, {d:'2027-01-13', venue:'Fieldhouse', conf:false},
      {d:'2027-01-18'}, {d:'2027-01-20'},
      {d:'2027-01-25'}, {d:'2027-01-27'},
      // February 2027
      {d:'2027-02-01'}, {d:'2027-02-03'},
      {d:'2027-02-08'}, {d:'2027-02-10'},
      {d:'2027-02-15'}, {d:'2027-02-17'},
      {d:'2027-02-22'}, {d:'2027-02-24'},
      // March 2027
      {d:'2027-03-01'}, {d:'2027-03-03'},
      {d:'2027-03-08'}, {d:'2027-03-10'},
      {d:'2027-03-15'}, {d:'2027-03-17'},
      // April 2027
      {d:'2027-04-05'}, {d:'2027-04-07'},
      {d:'2027-04-12'}, {d:'2027-04-14'},
      {d:'2027-04-19'}, {d:'2027-04-21'},
      {d:'2027-04-26'}, {d:'2027-04-28'},
      // May 2027
      {d:'2027-05-03'}, {d:'2027-05-05'},
      {d:'2027-05-10'}, {d:'2027-05-12'},
    ];

    function pdate(s) {
      const [y,m,d] = s.split('-').map(Number);
      return new Date(y, m-1, d);
    }

    function cellHtml(p, nextIdx) {
      if (!p) return '<div class="day-cell empty"></div>';

      const date  = pdate(p.d);
      const idx   = PRACTICES.indexOf(p);
      const today = window._today;
      const isPast = date < today;
      const isNext = idx === nextIdx;

      const dayAbbr = DAYS_SHORT[date.getDay()];
      const dateStr = MONTHS[date.getMonth()].slice(0,3) + ' ' + date.getDate();

      let venueHtml = '';
      if (p.venue === 'Fieldhouse') {
        venueHtml = p.conf
          ? '<span class="chip chip-fh">✓ Fieldhouse</span>'
          : '<span class="chip chip-unconf">Fieldhouse · ?</span>';
      } else {
        venueHtml = '<span class="chip chip-jac">JAC</span>';
      }

      const nextTag = isNext ? '<span class="next-tag">Next</span>' : '';

      const cls = ['day-cell', isPast && 'past', isNext && 'next-up'].filter(Boolean).join(' ');

      return `<div class="${cls}">
        <span class="cell-day">${dayAbbr}</span>
        <span class="cell-date">${dateStr}</span>
        ${venueHtml}${nextTag}
      </div>`;
    }

    function render() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      window._today = today;

      // Find next practice
      let nextIdx = -1;
      for (let i = 0; i < PRACTICES.length; i++) {
        if (pdate(PRACTICES[i].d) >= today) { nextIdx = i; break; }
      }

      // Update header facts line
      const upcoming = nextIdx >= 0 ? PRACTICES.length - nextIdx : 0;
      const factsEl = document.getElementById('page-facts');
      if (factsEl) {
        if (nextIdx >= 0) {
          const np = PRACTICES[nextIdx];
          const nd = pdate(np.d);
          const nextStr = MONTHS[nd.getMonth()].slice(0,3) + ' ' + nd.getDate();
          factsEl.textContent = upcoming + ' upcoming · Next: ' + nextStr;
        } else {
          factsEl.textContent = 'Season complete · 42 practices';
        }
      }

      // Group by month
      const groups = new Map();
      for (const p of PRACTICES) {
        const key = p.d.slice(0, 7);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(p);
      }

      let html = '';
      for (const [key, list] of groups) {
        const [y, m] = key.split('-').map(Number);
        const mName = MONTHS[m - 1];

        // Pair Mondays and Wednesdays
        const pairs = [];
        let i = 0;
        while (i < list.length) {
          const day = pdate(list[i].d).getDay();
          if (day === 1) {
            // Monday — pair with next if it's Wednesday
            const wed = list[i + 1] && pdate(list[i + 1].d).getDay() === 3 ? list[i + 1] : null;
            pairs.push([list[i], wed]);
            i += wed ? 2 : 1;
          } else {
            // Wednesday without a Monday (shouldn't happen but handle gracefully)
            pairs.push([null, list[i]]);
            i++;
          }
        }

        html += `<section class="month">
          <div class="month-hd">
            <span class="month-nm">${mName} ${y}</span>
            <span class="month-ct">${list.length} practice${list.length === 1 ? '' : 's'}</span>
          </div>
          <div class="col-heads">
            <div class="col-head">Monday</div>
            <div class="col-head">Wednesday</div>
          </div>`;

        for (const [mon, wed] of pairs) {
          html += `<div class="week-pair">
            ${cellHtml(mon, nextIdx)}
            ${wed !== undefined ? cellHtml(wed, nextIdx) : '<div class="day-cell empty"></div>'}
          </div>`;
        }

        html += '</section>';
      }

      document.getElementById('schedule').innerHTML = html;

      // Scroll to next practice if not near the top
      if (nextIdx > 3) {
        const el = document.querySelector('.next-up');
        if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 150);
      }
    }

    render();
  </script>
<script>
  // Lets families install the site as an app and open it offline (see sw.js)
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
</body>
</html>
