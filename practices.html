<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wind VBC · Practices</title>
  <!-- App install (home screen) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0b1f3a">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wind VBC">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0b1f3a;
      --surf:         #0d2448;
      --ink:          #f0f5ff;
      --muted:        rgba(200,220,255,.65);
      --rule:         rgba(90,172,245,.12);
      --accent:       #c9a84c;
      --sky:          #5aacf5;
      --amber:        #fbbf24;
      --amber-bg:     rgba(251,191,36,.1);
      --amber-border: rgba(251,191,36,.25);
      color-scheme: dark;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--ink); font-family: 'DM Sans', sans-serif; font-weight: 300; line-height: 1.6; min-height: 100vh; }

    /* ── NAV ── */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: .9rem 2.5rem;
      background: rgba(11,31,58,.97);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(90,172,245,.2);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { font-family: 'Oswald', sans-serif; font-size: 1.5rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); text-decoration: none; }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; color: rgba(240,245,255,.45); font-weight: 500; transition: color .2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--ink); }
    @media (max-width: 600px) { nav { padding: .8rem 1.25rem; } }

    /* ── PAGE HEADER ── */
    .page-header {
      padding: 3rem 2.5rem 2.5rem;
      border-bottom: 1px solid var(--rule);
      max-width: 760px;
    }
    .eyebrow { font-size: .65rem; letter-spacing: .26em; text-transform: uppercase; color: var(--accent); margin-bottom: .5rem; font-weight: 500; }
    .page-title { font-family: 'Oswald', sans-serif; font-size: clamp(1.8rem, 5vw, 2.8rem); font-weight: 400; line-height: 1.05; letter-spacing: .04em; text-transform: uppercase; margin-bottom: .5rem; }
    .page-sub { font-size: .88rem; color: var(--muted); }
    .page-facts { font-size: .8rem; color: var(--muted); margin-top: .4rem; opacity: .8; }
    @media (max-width: 600px) { .page-header { padding: 1.5rem 1.25rem 1.25rem; } }

    /* ── CONTENT ── */
    .content { padding: 2rem 2.5rem 5rem; max-width: 760px; }
    @media (max-width: 600px) { .content { padding: 1.5rem 1.25rem 4rem; } }

    /* ── LEGEND ── */
    .legend {
      display: flex; flex-wrap: wrap; gap: .5rem 1.8rem;
      margin-bottom: 2rem;
      padding: .75rem 1rem;
      background: var(--surf); border: 1px solid var(--rule); border-radius: 6px;
      font-size: .78rem; color: var(--muted); align-items: center;
    }
    .legend-item { display: flex; align-items: center; gap: .5rem; }

    /* ── CHIPS ── */
    .chip {
      display: inline-flex; align-items: center; gap: .22rem;
      font-size: .64rem; font-weight: 500; letter-spacing: .07em; text-transform: uppercase;
      padding: .17rem .48rem; border-radius: 3px; white-space: nowrap; flex-shrink: 0;
    }
    .chip-fh     { background: rgba(90,172,245,.14); color: var(--sky); border: 1px solid rgba(90,172,245,.32); }
    .chip-unconf { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
    .chip-jac    { background: rgba(240,245,255,.06); color: var(--muted); border: 1px solid var(--rule); }
    .chip-opt    { background: rgba(201,168,76,.08); color: var(--accent); border: 1px solid rgba(201,168,76,.2); }

    /* ── MONTH SECTION ── */
    .month { margin-bottom: 2.5rem; }
    .month-hd { display: flex; align-items: baseline; gap: 1rem; padding-bottom: .5rem; border-bottom: 2px solid var(--accent); }
    .month-nm { font-family: 'Oswald', sans-serif; font-size: 1.4rem; font-weight: 400; letter-spacing: .06em; }
    .month-ct { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

    /* ── PRACTICE ROWS ── */
    .prac-row {
      display: grid; grid-template-columns: 2.2rem 4.2rem 1fr auto;
      align-items: center; gap: .6rem;
      padding: .58rem .75rem;
      font-size: .88rem;
      border-top: 1px solid var(--rule);
    }
    .prac-row:first-of-type { border-top: none; }
    .prac-row.past { opacity: .3; }
    .prac-row.next-up { background: rgba(201,168,76,.08); box-shadow: inset 3px 0 0 var(--accent); }
    .cell-day { font-size: .63rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .cell-date { font-weight: 400; font-variant-numeric: tabular-nums; }
    .cell-time { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .cell-tags { display: flex; gap: .4rem; align-items: center; justify-content: flex-end; }
    .next-tag { font-size: .58rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 500; background: rgba(201,168,76,.12); padding: .13rem .38rem; border-radius: 3px; }
    .tba {
      margin-top: .5rem; padding: .9rem 1rem;
      background: var(--surf); border: 1px dashed var(--rule); border-radius: 6px;
      font-size: .82rem; color: var(--muted);
    }

    @media (max-width: 500px) {
      .prac-row { grid-template-columns: 2rem 3.8rem 1fr; }
      .cell-tags { grid-column: 3; justify-content: flex-start; }
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--rule);
      padding: 1.5rem 2.5rem;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .5rem;
      font-size: .74rem; color: var(--muted);
    }
    .footer-logo { font-family: 'Oswald', sans-serif; font-size: .9rem; color: var(--ink); }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Wind<span> VBC</span></a>
    <ul class="nav-links">
      <li><a href="index.html">About the Club</a></li>
      <li><a href="team.html">U13 Team</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <p class="eyebrow">2026–27 Season</p>
    <h1 class="page-title">Practice Schedule</h1>
    <p class="page-sub">Weekdays 4:15–6:15 PM · Sundays 9–11 AM · The Prairie School</p>
    <p class="page-facts" id="page-facts"></p>
  </div>

  <div class="content">

    <div class="legend">
      <span class="legend-item">
        <span class="chip chip-fh">Field House</span>
        Prairie Field House
      </span>
      <span class="legend-item">
        <span class="chip chip-jac">JAC</span>
        Johnson Athletic Complex
      </span>
      <span class="legend-item">
        <span class="chip chip-opt">Optional</span>
        pre-season, optional
      </span>
    </div>

    <div id="schedule"></div>

  </div>

  <footer>
    <span class="footer-logo">Wind Volleyball Club</span>
    <span>© 2026 · Racine, WI</span>
  </footer>

  <script>
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    // Times: Sundays 9–11 AM, all other days 4:15–6:15 PM
    // Practices after March 9 are not confirmed yet — add them here when they are.
    const PRACTICES = [
      {d:'2026-12-08', v:'FH'},
      {d:'2026-12-11', v:'FH'},
      {d:'2026-12-13', v:'JAC'},
      {d:'2026-12-15', v:'FH'},
      {d:'2026-12-18', v:'JAC'},
      {d:'2026-12-20', v:'JAC'},
      {d:'2026-12-21', v:'JAC'},
      {d:'2026-12-23', v:'JAC'},
      {d:'2026-12-28', v:'JAC'},
      {d:'2026-12-30', v:'JAC'},
      {d:'2027-01-03', v:'JAC'},
      {d:'2027-01-05', v:'FH'},
      {d:'2027-01-07', v:'FH'},
      {d:'2027-01-10', v:'JAC'},
      {d:'2027-01-12', v:'FH'},
      {d:'2027-01-14', v:'FH'},
      {d:'2027-01-19', v:'FH'},
      {d:'2027-01-21', v:'FH'},
      {d:'2027-01-24', v:'JAC'},
      {d:'2027-01-26', v:'FH'},
      {d:'2027-01-29', v:'FH'},
      {d:'2027-02-02', v:'FH'},
      {d:'2027-02-05', v:'FH'},
      {d:'2027-02-07', v:'JAC'},
      {d:'2027-02-09', v:'FH'},
      {d:'2027-02-11', v:'FH'},
      {d:'2027-02-14', v:'JAC'},
      {d:'2027-02-16', v:'FH'},
      {d:'2027-02-18', v:'FH'},
      {d:'2027-02-23', v:'FH'},
      {d:'2027-02-25', v:'FH'},
      {d:'2027-02-28', v:'JAC'},
      {d:'2027-03-02', v:'FH'},
      {d:'2027-03-04', v:'FH'},
      {d:'2027-03-09', v:'FH'},
    ];

    function pdate(s) {
      const [y,m,d] = s.split('-').map(Number);
      return new Date(y, m-1, d);
    }

    function timeFor(date) {
      return date.getDay() === 0 ? '9–11 AM' : '4:15–6:15 PM';
    }

    function rowHtml(p, idx, nextIdx, today) {
      const date = pdate(p.d);
      const isPast = date < today;
      const isNext = idx === nextIdx;
      const dayAbbr = DAYS_SHORT[date.getDay()];
      const dateStr = MONTHS[date.getMonth()].slice(0,3) + ' ' + date.getDate();
      const venue = p.v === 'FH'
        ? '<span class="chip chip-fh">Field House</span>'
        : '<span class="chip chip-jac">JAC</span>';
      const nextTag = isNext ? '<span class="next-tag">Next</span>' : '';
      const cls = ['prac-row', isPast && 'past', isNext && 'next-up'].filter(Boolean).join(' ');
      return `<div class="${cls}">
        <span class="cell-day">${dayAbbr}</span>
        <span class="cell-date">${dateStr}</span>
        <span class="cell-time">${timeFor(date)}</span>
        <span class="cell-tags">${venue}${nextTag}</span>
      </div>`;
    }

    const PRE_SEASON = [
      { d: '2026-11-14', time: '12–2 PM',  venue: 'JAC' },
      { d: '2026-11-22', time: '8–10 AM', venue: 'JAC' },
      { d: '2026-11-24', time: '8–10 AM', venue: 'JAC' },
    ];

    function render() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      let nextIdx = -1;
      for (let i = 0; i < PRACTICES.length; i++) {
        if (pdate(PRACTICES[i].d) >= today) { nextIdx = i; break; }
      }

      const factsEl = document.getElementById('page-facts');
      if (factsEl) {
        if (nextIdx >= 0) {
          const nd = pdate(PRACTICES[nextIdx].d);
          const upcoming = PRACTICES.length - nextIdx;
          factsEl.textContent = upcoming + ' scheduled · Next: ' + DAYS_SHORT[nd.getDay()] + ' ' + MONTHS[nd.getMonth()].slice(0,3) + ' ' + nd.getDate();
        } else {
          factsEl.textContent = PRACTICES.length + ' practices scheduled so far';
        }
      }

      const groups = new Map();
      PRACTICES.forEach((p, i) => {
        const key = p.d.slice(0, 7);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push([p, i]);
      });

      let html = '';

      // Pre-season optional section
      html += `<section class="month">
        <div class="month-hd">
          <span class="month-nm">Pre-Season</span>
          <span class="month-ct">${PRE_SEASON.length} optional</span>
        </div>`;
      for (const pre of PRE_SEASON) {
        const date = pdate(pre.d);
        const isPast = date < today;
        const dayAbbr = DAYS_SHORT[date.getDay()];
        const dateStr = MONTHS[date.getMonth()].slice(0,3) + ' ' + date.getDate();
        const cls = ['prac-row', isPast && 'past'].filter(Boolean).join(' ');
        html += `<div class="${cls}">
          <span class="cell-day">${dayAbbr}</span>
          <span class="cell-date">${dateStr}</span>
          <span class="cell-time">${pre.time}</span>
          <span class="cell-tags"><span class="chip chip-jac">${pre.venue}</span><span class="chip chip-opt">Optional</span></span>
        </div>`;
      }
      html += '</section>';

      for (const [key, list] of groups) {
        const [y, m] = key.split('-').map(Number);
        html += `<section class="month">
          <div class="month-hd">
            <span class="month-nm">${MONTHS[m - 1]} ${y}</span>
            <span class="month-ct">${list.length} practice${list.length === 1 ? '' : 's'}</span>
          </div>`;
        for (const [p, i] of list) html += rowHtml(p, i, nextIdx, today);
        html += '</section>';
      }
      html += '<div class="tba">Practices after March 9 will be posted once confirmed.</div>';

      document.getElementById('schedule').innerHTML = html;

      if (nextIdx > 3) {
        const el = document.querySelector('.next-up');
        if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 150);
      }
    }

    render();
  </script>
<script>
  // Lets families install the site as an app and open it offline (see sw.js)
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
</body>
</html>
